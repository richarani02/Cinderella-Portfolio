<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 60" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false">
  <!-- Ornamental section divider with filigree and central diamond -->

  <!-- Left wing scrollwork -->
  <path d="M 0 30 Q 80 30 140 30"
        fill="none" stroke="rgba(200,216,245,0.08)" stroke-width="1"/>
  <path d="M 60 30 Q 90 15 120 30 Q 90 45 60 30"
        fill="none" stroke="rgba(200,216,245,0.12)" stroke-width="0.75"/>

  <!-- Left gradient line -->
  <line x1="0" y1="30" x2="340" y2="30" stroke="url(#divLeft)" stroke-width="0.75"/>

  <!-- Central ornament cluster -->
  <!-- Outer diamond -->
  <rect x="392" y="22" width="16" height="16" transform="rotate(45 400 30)"
        fill="none" stroke="rgba(212,184,150,0.5)" stroke-width="0.75"/>
  <!-- Inner diamond -->
  <rect x="396" y="26" width="8" height="8" transform="rotate(45 400 30)"
        fill="rgba(212,184,150,0.25)"/>
  <!-- Center dot -->
  <circle cx="400" cy="30" r="1.5" fill="rgba(212,184,150,0.7)"/>

  <!-- Small satellite diamonds -->
  <rect x="372" y="26" width="8" height="8" transform="rotate(45 376 30)"
        fill="none" stroke="rgba(212,184,150,0.25)" stroke-width="0.5"/>
  <rect x="416" y="26" width="8" height="8" transform="rotate(45 420 30)"
        fill="none" stroke="rgba(212,184,150,0.25)" stroke-width="0.5"/>

  <!-- Right gradient line -->
  <line x1="460" y1="30" x2="800" y2="30" stroke="url(#divRight)" stroke-width="0.75"/>

  <!-- Right wing scrollwork -->
  <path d="M 660 30 Q 690 15 720 30 Q 690 45 660 30"
        fill="none" stroke="rgba(200,216,245,0.12)" stroke-width="0.75"/>

  <defs>
    <linearGradient id="divLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:transparent"/>
      <stop offset="40%" style="stop-color:rgba(200,216,245,0.12)"/>
      <stop offset="100%" style="stop-color:rgba(212,184,150,0.3)"/>
    </linearGradient>
    <linearGradient id="divRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:rgba(212,184,150,0.3)"/>
      <stop offset="60%" style="stop-color:rgba(200,216,245,0.12)"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </linearGradient>
  </defs>
</svg>
