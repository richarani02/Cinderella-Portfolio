<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false">
  <!-- Midnight Clock & Constellation Dial SVG -->
  <defs>
    <radialGradient id="clockGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(212, 184, 150, 0.15)"/>
      <stop offset="70%" stop-color="rgba(200, 216, 245, 0.03)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- Background glow -->
  <circle cx="80" cy="80" r="76" fill="url(#clockGlow)" />

  <!-- Outer dial ring -->
  <circle cx="80" cy="80" r="72" fill="none" stroke="rgba(200, 216, 245, 0.15)" stroke-width="0.75"/>
  <circle cx="80" cy="80" r="64" fill="none" stroke="rgba(212, 184, 150, 0.2)" stroke-width="0.5" stroke-dasharray="1 3"/>
  <circle cx="80" cy="80" r="54" fill="none" stroke="rgba(200, 216, 245, 0.08)" stroke-width="0.5"/>

  <!-- 12 Hour tick markers (Stars and diamonds) -->
  <!-- 12 o'clock - Midnight Star -->
  <polygon points="80,12 82.5,18 88.5,18 84,21.5 85.5,27.5 80,24 74.5,27.5 76,21.5 71.5,18 77.5,18" fill="rgba(212, 184, 150, 0.9)"/>
  
  <!-- 1 through 11 tick dots/diamonds -->
  <circle cx="112" cy="24.5" r="1.5" fill="rgba(200, 216, 245, 0.5)"/>
  <circle cx="135.5" cy="48" r="1.5" fill="rgba(200, 216, 245, 0.5)"/>
  <polygon points="144,80 146,82 144,84 142,82" fill="rgba(212, 184, 150, 0.7)"/>
  <circle cx="135.5" cy="112" r="1.5" fill="rgba(200, 216, 245, 0.5)"/>
  <circle cx="112" cy="135.5" r="1.5" fill="rgba(200, 216, 245, 0.5)"/>
  <polygon points="80,144 82,146 80,148 78,146" fill="rgba(212, 184, 150, 0.7)"/>
  <circle cx="48" cy="135.5" r="1.5" fill="rgba(200, 216, 245, 0.5)"/>
  <circle cx="24.5" cy="112" r="1.5" fill="rgba(200, 216, 245, 0.5)"/>
  <polygon points="16,80 18,82 16,84 14,82" fill="rgba(212, 184, 150, 0.7)"/>
  <circle cx="24.5" cy="48" r="1.5" fill="rgba(200, 216, 245, 0.5)"/>
  <circle cx="48" cy="24.5" r="1.5" fill="rgba(200, 216, 245, 0.5)"/>

  <!-- Hands positioned almost at Midnight (11:58) -->
  <!-- Hour hand pointing towards 12 -->
  <line x1="80" y1="80" x2="79" y2="40" stroke="rgba(212, 184, 150, 0.85)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Minute hand pointing right before 12 -->
  <line x1="80" y1="80" x2="77" y2="28" stroke="rgba(200, 216, 245, 0.9)" stroke-width="1" stroke-linecap="round"/>
  <!-- Center pivot diamond -->
  <rect x="77" y="77" width="6" height="6" transform="rotate(45 80 80)" fill="rgba(212, 184, 150, 0.9)"/>
</svg>
