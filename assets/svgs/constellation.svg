<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false">
  <!-- Constellation: loose star-path for skill group background decor -->
  <!-- Stars as small polygons + circles with connecting lines -->
  <defs>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(212, 184, 150, 0.9)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- Constellation connecting lines — drawn BEFORE stars so stars sit on top -->
  <line x1="38"  y1="28"  x2="92"  y2="60"  stroke="rgba(200, 216, 245, 0.15)" stroke-width="0.6"/>
  <line x1="92"  y1="60"  x2="155" y2="42"  stroke="rgba(200, 216, 245, 0.12)" stroke-width="0.6"/>
  <line x1="155" y1="42"  x2="220" y2="78"  stroke="rgba(200, 216, 245, 0.12)" stroke-width="0.6"/>
  <line x1="220" y1="78"  x2="280" y2="50"  stroke="rgba(200, 216, 245, 0.10)" stroke-width="0.6"/>
  <line x1="280" y1="50"  x2="340" y2="68"  stroke="rgba(200, 216, 245, 0.10)" stroke-width="0.6"/>
  <line x1="92"  y1="60"  x2="130" y2="90"  stroke="rgba(200, 216, 245, 0.08)" stroke-width="0.5"/>
  <line x1="155" y1="42"  x2="180" y2="20"  stroke="rgba(200, 216, 245, 0.08)" stroke-width="0.5"/>
  <line x1="220" y1="78"  x2="240" y2="100" stroke="rgba(200, 216, 245, 0.08)" stroke-width="0.5"/>
  <line x1="280" y1="50"  x2="310" y2="28"  stroke="rgba(200, 216, 245, 0.08)" stroke-width="0.5"/>

  <!-- Primary stars (champagne) -->
  <polygon points="38,24 40,28 44,28 41,30.5 42,35 38,32.5 34,35 35,30.5 32,28 36,28" fill="rgba(212, 184, 150, 0.8)" opacity="0.85"/>
  <polygon points="155,36 156.5,40 160,40 157.5,42 158.5,46 155,43.5 151.5,46 152.5,42 150,40 153.5,40" fill="rgba(212, 184, 150, 0.75)" opacity="0.8"/>
  <polygon points="280,44 281.5,48 285,48 282.5,50.5 283.5,54.5 280,52 276.5,54.5 277.5,50.5 275,48 278.5,48" fill="rgba(212, 184, 150, 0.7)" opacity="0.75"/>

  <!-- Secondary stars (moonlight) — simpler circles -->
  <circle cx="92"  cy="60"  r="2.5" fill="rgba(200, 216, 245, 0.65)"/>
  <circle cx="220" cy="78"  r="2"   fill="rgba(200, 216, 245, 0.6)"/>
  <circle cx="340" cy="68"  r="2"   fill="rgba(200, 216, 245, 0.55)"/>

  <!-- Tertiary (tiny) dots -->
  <circle cx="130" cy="90"  r="1.2" fill="rgba(200, 216, 245, 0.4)"/>
  <circle cx="180" cy="20"  r="1.2" fill="rgba(200, 216, 245, 0.4)"/>
  <circle cx="240" cy="100" r="1"   fill="rgba(200, 216, 245, 0.35)"/>
  <circle cx="310" cy="28"  r="1"   fill="rgba(200, 216, 245, 0.35)"/>
  <circle cx="62"  cy="100" r="0.9" fill="rgba(200, 216, 245, 0.3)"/>
  <circle cx="360" cy="35"  r="0.9" fill="rgba(200, 216, 245, 0.3)"/>
</svg>
