<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" aria-hidden="true" focusable="false">
  <defs>
    <!-- Bright light-blue glass gradient -->
    <linearGradient id="slipperGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#D6F0FF" stop-opacity="0.92"/>
      <stop offset="35%"  stop-color="#A9D8F5" stop-opacity="0.80"/>
      <stop offset="75%"  stop-color="#7EC8F0" stop-opacity="0.70"/>
      <stop offset="100%" stop-color="#4DA8E8" stop-opacity="0.60"/>
    </linearGradient>
    <!-- Pearl-white shine -->
    <linearGradient id="slipperShine" x1="0%" y1="0%" x2="55%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="60%"  stop-color="#E8F6FF" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#A9D8F5" stop-opacity="0"/>
    </linearGradient>
    <!-- Edge stroke gradient -->
    <linearGradient id="slipperEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#A9D8F5" stop-opacity="0.55"/>
    </linearGradient>
    <!-- Soft core glow -->
    <filter id="slipperGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Bright outer shine filter -->
    <filter id="slipperShineF" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="glow"/>
      <feColorMatrix type="matrix"
        values="0.8 0 0 0 0.2  0 0.9 0 0 0.4  0 0 1 0 0.6  0 0 0 0.9 0"
        result="blueGlow"/>
      <feMerge><feMergeNode in="blueGlow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Heel -->
  <path d="M 20 72 Q 18 82 28 84 Q 38 86 40 78 L 42 72 Z"
        fill="url(#slipperGlass)" stroke="url(#slipperEdge)" stroke-width="1"
        filter="url(#slipperGlow)"/>

  <!-- Sole -->
  <path d="M 20 72 Q 22 68 45 66 L 100 66 Q 108 66 110 62 Q 112 58 108 56 L 42 56 Q 38 56 36 58 L 20 72 Z"
        fill="url(#slipperGlass)" stroke="url(#slipperEdge)" stroke-width="0.9"
        filter="url(#slipperGlow)"/>

  <!-- Upper body of slipper -->
  <path d="M 42 56 Q 48 38 70 26 Q 88 16 104 20 Q 114 24 110 36 Q 106 50 92 54 Q 76 58 60 58 L 42 58 Z"
        fill="url(#slipperGlass)" stroke="url(#slipperEdge)" stroke-width="1.2"
        filter="url(#slipperShineF)"/>

  <!-- Main shine highlight — bright white -->
  <path d="M 68 30 Q 82 22 96 26 Q 104 30 100 38 Q 88 26 68 30 Z"
        fill="url(#slipperShine)" opacity="0.95"/>

  <!-- Second inner shine -->
  <path d="M 58 42 Q 66 36 78 36 Q 74 46 58 46 Z"
        fill="#FFFFFF" opacity="0.65"/>

  <!-- Third thin shimmer band -->
  <path d="M 45 54 Q 70 50 90 52 Q 70 54 45 56 Z"
        fill="#E8F6FF" opacity="0.55"/>

  <!-- Toe sparkle — bright white-gold cross -->
  <circle cx="104" cy="28" r="2.2" fill="#FFFFFF" opacity="0.98"
          filter="url(#slipperGlow)"/>
  <circle cx="104" cy="28" r="1.2" fill="#D9B86C" opacity="0.90"/>
  <line x1="104" y1="23" x2="104" y2="33" stroke="#FFFFFF" stroke-width="0.8" opacity="0.85"/>
  <line x1="99"  y1="28" x2="109" y2="28" stroke="#FFFFFF" stroke-width="0.8" opacity="0.85"/>
  <line x1="101" y1="25" x2="107" y2="31" stroke="#E8F6FF" stroke-width="0.5" opacity="0.60"/>
  <line x1="107" y1="25" x2="101" y2="31" stroke="#E8F6FF" stroke-width="0.5" opacity="0.60"/>

  <!-- Ankle bow — light blue tint -->
  <path d="M 50 46 Q 45 40 50 38 Q 55 36 54 42 Q 53 48 50 46 Z"
        fill="rgba(169,216,245,0.75)" stroke="#A9D8F5" stroke-width="0.8"/>
  <path d="M 54 42 Q 55 36 60 38 Q 65 40 60 46 Q 57 48 54 42 Z"
        fill="rgba(169,216,245,0.75)" stroke="#A9D8F5" stroke-width="0.8"/>
  <circle cx="52" cy="42" r="2.2" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="52" cy="42" r="1.0" fill="#A9D8F5" opacity="0.80"/>

  <!-- Glitter sparkles scattered around slipper — all bright white/blue -->
  <g filter="url(#slipperGlow)">
    <!-- Top-right glitter -->
    <circle cx="112" cy="16" r="1.8" fill="#FFFFFF" opacity="0.95"/>
    <line x1="112" y1="12" x2="112" y2="20" stroke="#FFFFFF" stroke-width="0.6" opacity="0.80"/>
    <line x1="108" y1="16" x2="116" y2="16" stroke="#FFFFFF" stroke-width="0.6" opacity="0.80"/>

    <!-- Bottom-left glitter -->
    <circle cx="16" cy="62" r="1.4" fill="#D6F0FF" opacity="0.90"/>
    <line x1="16" y1="59" x2="16" y2="65" stroke="#D6F0FF" stroke-width="0.5" opacity="0.75"/>
    <line x1="13" y1="62" x2="19" y2="62" stroke="#D6F0FF" stroke-width="0.5" opacity="0.75"/>

    <!-- Mid-top glitter -->
    <circle cx="80" cy="14" r="1.2" fill="#FFFFFF" opacity="0.85"/>
    <line x1="80" y1="11" x2="80" y2="17" stroke="#FFFFFF" stroke-width="0.4" opacity="0.70"/>
    <line x1="77" y1="14" x2="83" y2="14" stroke="#FFFFFF" stroke-width="0.4" opacity="0.70"/>

    <!-- Extra tiny dots -->
    <circle cx="30" cy="20" r="0.9" fill="#A9D8F5" opacity="0.80"/>
    <circle cx="96" cy="62" r="0.8" fill="#FFFFFF" opacity="0.75"/>
    <circle cx="18" cy="46" r="0.7" fill="#D9B86C" opacity="0.70"/>
    <circle cx="106" cy="48" r="0.7" fill="#A9D8F5" opacity="0.70"/>
  </g>
</svg>
