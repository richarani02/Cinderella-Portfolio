<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 420" aria-hidden="true" focusable="false">
  <defs>
    <!-- Bright light-blue body -->
    <linearGradient id="cinBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#D6F0FF" stop-opacity="0.92"/>
      <stop offset="50%"  stop-color="#A9D8F5" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#5BBDE4" stop-opacity="0.70"/>
    </linearGradient>
    <!-- Gown — luminous light blue -->
    <linearGradient id="cinGown" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%"   stop-color="#E8F6FF" stop-opacity="0.90"/>
      <stop offset="30%"  stop-color="#A9D8F5" stop-opacity="0.80"/>
      <stop offset="65%"  stop-color="#7EC8F0" stop-opacity="0.70"/>
      <stop offset="100%" stop-color="#4DA8E8" stop-opacity="0.60"/>
    </linearGradient>
    <!-- White shine layer -->
    <linearGradient id="cinShine" x1="0%" y1="0%" x2="55%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.90"/>
      <stop offset="50%"  stop-color="#E8F6FF" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#A9D8F5" stop-opacity="0"/>
    </linearGradient>
    <!-- Hair / tiara — warm gold shimmer -->
    <linearGradient id="cinHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FFE8A0" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#D9B86C" stop-opacity="0.75"/>
    </linearGradient>
    <!-- Inner glow filter -->
    <filter id="cinGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Strong blue outer glow -->
    <filter id="cinShineF" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="glow"/>
      <feColorMatrix type="matrix"
        values="0.7 0 0 0 0.2  0 0.85 0 0 0.45  0 0 1 0 0.65  0 0 0 0.85 0"
        result="blueGlow"/>
      <feMerge><feMergeNode in="blueGlow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── GOWN OUTER LAYER ───────────────────────────────────── -->
  <path d="M 100 230 Q 10 290 0 390 Q 5 420 100 418 Q 195 420 200 390 Q 190 290 100 230 Z"
        fill="url(#cinGown)" stroke="#D6F0FF" stroke-width="1.5" stroke-opacity="0.60"
        filter="url(#cinShineF)"/>

  <!-- Gown mid layer -->
  <path d="M 100 235 Q 30 285 25 375 Q 40 408 100 410 Q 160 408 175 375 Q 170 285 100 235 Z"
        fill="url(#cinGown)" stroke="#A9D8F5" stroke-width="1" stroke-opacity="0.55"/>

  <!-- Gown inner layer -->
  <path d="M 100 240 Q 55 278 52 360 Q 62 395 100 398 Q 138 395 148 360 Q 145 278 100 240 Z"
        fill="url(#cinBody)" stroke="#D6F0FF" stroke-width="1.2" stroke-opacity="0.70"/>

  <!-- Gown shine left -->
  <path d="M 70 250 Q 45 295 48 360 Q 55 300 75 265 Z"
        fill="url(#cinShine)" opacity="0.80"/>

  <!-- Gown shine right -->
  <path d="M 130 250 Q 155 295 152 360 Q 145 300 125 265 Z"
        fill="url(#cinShine)" opacity="0.55"/>

  <!-- Ruffle lines — bright white-blue -->
  <path d="M 68 255 Q 100 248 132 255" fill="none" stroke="#D6F0FF" stroke-width="1.5" stroke-opacity="0.75"/>
  <path d="M 55 290 Q 100 280 145 290" fill="none" stroke="#A9D8F5" stroke-width="1.2" stroke-opacity="0.65"/>
  <path d="M 38 330 Q 100 318 162 330" fill="none" stroke="#A9D8F5" stroke-width="1.0" stroke-opacity="0.55"/>
  <path d="M 25 370 Q 100 355 175 370" fill="none" stroke="#7EC8F0" stroke-width="0.8" stroke-opacity="0.45"/>

  <!-- ── BODICE ────────────────────────────────────────────── -->
  <path d="M 78 170 Q 68 195 70 230 Q 85 240 100 240 Q 115 240 130 230 Q 132 195 122 170 Z"
        fill="url(#cinBody)" stroke="#D6F0FF" stroke-width="1.5" stroke-opacity="0.75"
        filter="url(#cinGlow)"/>

  <!-- Bodice shine -->
  <path d="M 82 175 Q 76 195 78 220 Q 88 215 90 185 Z"
        fill="#FFFFFF" opacity="0.45"/>

  <!-- Waist belt — golden -->
  <path d="M 74 227 Q 100 222 126 227" fill="none" stroke="#FFE8A0" stroke-width="2" stroke-opacity="0.75"/>

  <!-- ── ARMS ─────────────────────────────────────────────── -->
  <path d="M 78 175 Q 55 165 42 148 Q 38 142 44 138 Q 50 134 56 142 Q 65 158 82 185 Z"
        fill="url(#cinBody)" stroke="#D6F0FF" stroke-width="0.9" stroke-opacity="0.65"/>
  <path d="M 122 175 Q 142 182 148 195 Q 152 200 148 204 Q 144 208 140 202 Q 134 190 118 182 Z"
        fill="url(#cinBody)" stroke="#D6F0FF" stroke-width="0.9" stroke-opacity="0.65"/>

  <!-- ── NECK & HEAD ─────────────────────────────────────── -->
  <rect x="93" y="148" width="14" height="26" rx="6"
        fill="url(#cinBody)" stroke="#D6F0FF" stroke-width="0.9" stroke-opacity="0.70"/>

  <ellipse cx="100" cy="128" rx="26" ry="30"
           fill="url(#cinBody)" stroke="#D6F0FF" stroke-width="1.5" stroke-opacity="0.80"
           filter="url(#cinGlow)"/>

  <!-- Face highlight -->
  <ellipse cx="93" cy="120" rx="10" ry="12" fill="#FFFFFF" opacity="0.30"/>

  <!-- ── HAIR / UPDO ─────────────────────────────────────── -->
  <ellipse cx="100" cy="110" rx="28" ry="25"
           fill="url(#cinHair)" opacity="0.70"/>

  <ellipse cx="100" cy="92" rx="16" ry="14"
           fill="url(#cinHair)" stroke="#FFE8A0" stroke-width="1"
           filter="url(#cinGlow)"/>

  <!-- Hair strands -->
  <path d="M 74 115 Q 66 108 70 98 Q 74 90 80 96" fill="none"
        stroke="#FFE8A0" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 126 115 Q 134 108 130 98 Q 126 90 120 96" fill="none"
        stroke="#FFE8A0" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Crown / tiara — bright gold -->
  <path d="M 86 96 L 88 82 L 94 90 L 100 76 L 106 90 L 112 82 L 114 96"
        fill="none" stroke="#FFE8A0" stroke-width="2.2"
        stroke-linejoin="round" stroke-linecap="round"
        filter="url(#cinGlow)"/>
  <!-- Crown gems — bright -->
  <circle cx="100" cy="77" r="3" fill="#FFFFFF" opacity="0.98"
          filter="url(#cinGlow)"/>
  <circle cx="100" cy="77" r="1.8" fill="#D9B86C" opacity="0.90"/>
  <circle cx="88"  cy="83" r="2.2" fill="#D6F0FF" opacity="0.95"/>
  <circle cx="112" cy="83" r="2.2" fill="#D6F0FF" opacity="0.95"/>

  <!-- ── MAGIC WAND ───────────────────────────────────────── -->
  <line x1="44" y1="139" x2="28" y2="112"
        stroke="#FFE8A0" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Wand star -->
  <polygon points="28,104 30,110 36,110 31,114 33,120 28,116 23,120 25,114 20,110 26,110"
           fill="#FFFFFF" opacity="0.98" filter="url(#cinGlow)"/>
  <polygon points="28,106 30,110 34,110 31,113 32,117 28,115 24,117 25,113 22,110 26,110"
           fill="#FFE8A0" opacity="0.85"/>

  <!-- Wand sparkle burst -->
  <g filter="url(#cinGlow)">
    <circle cx="16" cy="102" r="2"   fill="#FFFFFF" opacity="0.95"/>
    <circle cx="40" cy="98"  r="1.5" fill="#D6F0FF" opacity="0.90"/>
    <circle cx="12" cy="116" r="1.5" fill="#FFE8A0" opacity="0.85"/>
    <circle cx="38" cy="122" r="1.2" fill="#A9D8F5" opacity="0.85"/>
    <line x1="16" y1="98"  x2="16" y2="106" stroke="#FFFFFF" stroke-width="0.7" opacity="0.80"/>
    <line x1="12" y1="102" x2="20" y2="102" stroke="#FFFFFF" stroke-width="0.7" opacity="0.80"/>
    <line x1="40" y1="94"  x2="40" y2="102" stroke="#D6F0FF" stroke-width="0.6" opacity="0.75"/>
    <line x1="36" y1="98"  x2="44" y2="98"  stroke="#D6F0FF" stroke-width="0.6" opacity="0.75"/>
  </g>

  <!-- ── GLITTER SPARKLES scattered around figure ─────────── -->
  <g filter="url(#cinGlow)">
    <!-- Right side glitters -->
    <circle cx="162" cy="175" r="2"   fill="#FFFFFF" opacity="0.95"/>
    <line x1="162" y1="171" x2="162" y2="179" stroke="#FFFFFF" stroke-width="0.7" opacity="0.85"/>
    <line x1="158" y1="175" x2="166" y2="175" stroke="#FFFFFF" stroke-width="0.7" opacity="0.85"/>

    <circle cx="170" cy="240" r="1.6" fill="#D6F0FF" opacity="0.90"/>
    <line x1="170" y1="237" x2="170" y2="243" stroke="#D6F0FF" stroke-width="0.6" opacity="0.75"/>
    <line x1="167" y1="240" x2="173" y2="240" stroke="#D6F0FF" stroke-width="0.6" opacity="0.75"/>

    <circle cx="158" cy="310" r="1.4" fill="#A9D8F5" opacity="0.85"/>
    <line x1="158" y1="307" x2="158" y2="313" stroke="#A9D8F5" stroke-width="0.5" opacity="0.70"/>
    <line x1="155" y1="310" x2="161" y2="310" stroke="#A9D8F5" stroke-width="0.5" opacity="0.70"/>

    <!-- Left side glitters -->
    <circle cx="28"  cy="200" r="1.8" fill="#FFFFFF" opacity="0.92"/>
    <line x1="28" y1="196" x2="28" y2="204" stroke="#FFFFFF" stroke-width="0.6" opacity="0.80"/>
    <line x1="24" y1="200" x2="32" y2="200" stroke="#FFFFFF" stroke-width="0.6" opacity="0.80"/>

    <circle cx="20"  cy="280" r="1.4" fill="#D6F0FF" opacity="0.88"/>
    <line x1="20" y1="277" x2="20" y2="283" stroke="#D6F0FF" stroke-width="0.5" opacity="0.72"/>
    <line x1="17" y1="280" x2="23" y2="280" stroke="#D6F0FF" stroke-width="0.5" opacity="0.72"/>

    <!-- Tiny dot glitters -->
    <circle cx="175" cy="190" r="1.0" fill="#FFE8A0" opacity="0.80"/>
    <circle cx="22"  cy="250" r="1.0" fill="#FFE8A0" opacity="0.78"/>
    <circle cx="165" cy="350" r="0.9" fill="#FFFFFF"  opacity="0.75"/>
    <circle cx="30"  cy="360" r="0.9" fill="#A9D8F5"  opacity="0.72"/>
    <circle cx="175" cy="145" r="0.8" fill="#D6F0FF"  opacity="0.70"/>
    <circle cx="14"  cy="155" r="0.8" fill="#FFFFFF"  opacity="0.68"/>
  </g>
</svg>
