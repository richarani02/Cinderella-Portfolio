<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" aria-hidden="true" focusable="false">
  <defs>
    <!-- Light Blue Glass Step Gradient -->
    <linearGradient id="stairGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#D6F0FF" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#A9D8F5" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#4DA8E8" stop-opacity="0.60"/>
    </linearGradient>

    <!-- Balustrade Railing Gradient -->
    <linearGradient id="railGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4DA8E8"/>
      <stop offset="50%" stop-color="#A9D8F5"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Aura Radial Glow -->
    <radialGradient id="stairGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8F6FF" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#A9D8F5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Sparkle Cross -->
    <g id="stairSparkle">
      <path d="M 0,-12 Q 0,0 12,0 Q 0,0 0,12 Q 0,0 -12,0 Q 0,0 0,-12 Z" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="3" fill="#E8F6FF"/>
    </g>
  </defs>

  <!-- Ethereal Glow Backdrop -->
  <ellipse cx="250" cy="220" rx="220" ry="150" fill="url(#stairGlow)"/>

  <!-- Grand Glass Staircase Steps (Rising from Bottom-Left to Top-Right) -->
  <g stroke="#FFFFFF" stroke-width="1.5">
    <!-- Step 1 (Bottom Left) -->
    <polygon points="40,360 160,360 220,320 100,320" fill="url(#stairGlass)"/>
    <polygon points="40,360 160,360 160,375 40,375" fill="#4DA8E8" opacity="0.8"/>

    <!-- Step 2 -->
    <polygon points="80,320 200,320 260,280 140,280" fill="url(#stairGlass)"/>
    <polygon points="80,320 200,320 200,335 80,335" fill="#4DA8E8" opacity="0.8"/>

    <!-- Step 3 -->
    <polygon points="120,280 240,280 300,240 180,240" fill="url(#stairGlass)"/>
    <polygon points="120,280 240,280 240,295 120,295" fill="#4DA8E8" opacity="0.8"/>

    <!-- Step 4 -->
    <polygon points="160,240 280,240 340,200 220,200" fill="url(#stairGlass)"/>
    <polygon points="160,240 280,240 280,255 160,255" fill="#4DA8E8" opacity="0.8"/>

    <!-- Step 5 -->
    <polygon points="200,200 320,200 380,160 260,160" fill="url(#stairGlass)"/>
    <polygon points="200,200 320,200 320,215 200,215" fill="#4DA8E8" opacity="0.8"/>

    <!-- Step 6 -->
    <polygon points="240,160 360,160 420,120 300,120" fill="url(#stairGlass)"/>
    <polygon points="240,160 360,160 360,175 240,175" fill="#4DA8E8" opacity="0.8"/>

    <!-- Step 7 (Top Right Landing) -->
    <polygon points="280,120 400,120 460,80 340,80" fill="url(#stairGlass)"/>
    <polygon points="280,120 400,120 400,135 280,135" fill="#4DA8E8" opacity="0.8"/>
  </g>

  <!-- Crystal Balustrade Posts & Railing (Front Left) -->
  <path d="M 40 290 L 280 50" fill="none" stroke="url(#railGrad)" stroke-width="6" stroke-linecap="round"/>
  <path d="M 40 290 L 280 50" fill="none" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Balusters (Vertical Crystal Columns) -->
  <line x1="40" y1="360" x2="40" y2="290" stroke="url(#railGrad)" stroke-width="4"/>
  <line x1="80" y1="320" x2="80" y2="250" stroke="url(#railGrad)" stroke-width="3"/>
  <line x1="120" y1="280" x2="120" y2="210" stroke="url(#railGrad)" stroke-width="3"/>
  <line x1="160" y1="240" x2="160" y2="170" stroke="url(#railGrad)" stroke-width="3"/>
  <line x1="200" y1="200" x2="200" y2="130" stroke="url(#railGrad)" stroke-width="3"/>
  <line x1="240" y1="160" x2="240" y2="90" stroke="url(#railGrad)" stroke-width="3"/>
  <line x1="280" y1="120" x2="280" y2="50" stroke="url(#railGrad)" stroke-width="4"/>

  <!-- Railing Finial Crystal Orbs -->
  <circle cx="40" cy="285" r="7" fill="#FFFFFF"/>
  <circle cx="280" cy="45" r="9" fill="#FFFFFF"/>

  <!-- Sparkle Accents on Stair Edges -->
  <use href="#stairSparkle" x="280" y="45" transform="scale(1.4)"/>
  <use href="#stairSparkle" x="40" y="285"/>
  <use href="#stairSparkle" x="160" y="240" transform="scale(1.2)"/>
  <use href="#stairSparkle" x="240" y="160"/>
  <use href="#stairSparkle" x="340" y="80" transform="scale(1.3)"/>
  <use href="#stairSparkle" x="100" y="320"/>
  <use href="#stairSparkle" x="360" y="160"/>
</svg>
