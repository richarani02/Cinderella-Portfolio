<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 350" aria-hidden="true" focusable="false">
  <defs>
    <!-- Bright Shining Light Blue Horse Gradient -->
    <linearGradient id="horseBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#D6F0FF" stop-opacity="0.90"/>
      <stop offset="70%" stop-color="#A9D8F5" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#4DA8E8" stop-opacity="0.65"/>
    </linearGradient>

    <!-- Gold Harness & Saddle Gradient -->
    <linearGradient id="horseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6"/>
      <stop offset="100%" stop-color="#D9B86C"/>
    </linearGradient>

    <!-- Light Blue Glow Radial -->
    <radialGradient id="horseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8F6FF" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#A9D8F5" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Sparkle Cross -->
    <g id="horseSparkle">
      <path d="M 0,-10 Q 0,0 10,0 Q 0,0 0,10 Q 0,0 -10,0 Q 0,0 0,-10 Z" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="2.5" fill="#E8F6FF"/>
    </g>
  </defs>

  <!-- Luminous Background Glow -->
  <circle cx="175" cy="175" r="150" fill="url(#horseGlow)"/>

  <!-- Noble Rearing Royal Horse Figure -->
  <g fill="url(#horseBody)" stroke="#FFFFFF" stroke-width="1.2">
    <!-- Flowing Tail -->
    <path d="M 70 200 C 30 220 20 260 10 300 C 35 290 50 270 65 240 C 75 270 60 310 40 330 C 75 310 85 270 85 220 Z"/>

    <!-- Hind Legs (Standing & Support) -->
    <path d="M 100 210 Q 90 260 95 310 L 115 310 Q 110 265 125 225 Z"/>
    <path d="M 125 215 Q 115 260 120 305 L 140 305 Q 135 260 145 220 Z"/>

    <!-- Main Body & Torso -->
    <path d="M 85 200 Q 110 170 160 165 Q 210 160 240 120 Q 255 100 245 70 Q 235 45 220 35 C 228 48 220 62 205 68 Q 190 75 160 105 Q 130 135 105 170 Q 90 185 85 200 Z"/>

    <!-- Rearing Forelegs (Raised High in Triumph) -->
    <!-- Right Foreleg -->
    <path d="M 200 155 Q 240 140 270 105 Q 285 90 295 100 Q 280 118 245 150 Q 220 168 200 175 Z"/>
    <!-- Left Foreleg -->
    <path d="M 180 160 Q 220 130 255 85 Q 270 70 280 80 Q 260 102 225 142 Q 200 165 180 170 Z"/>

    <!-- Noble Head, Muzzle & Ears -->
    <path d="M 220 35 Q 228 20 235 15 Q 240 25 235 38 L 245 28 Q 248 38 242 45 Q 260 48 268 60 Q 272 72 260 78 Q 242 85 230 75 Z"/>
    <circle cx="250" cy="55" r="3" fill="#FFFFFF"/>

    <!-- Flowing Enchanted Mane -->
    <path d="M 220 35 Q 200 25 180 40 Q 200 50 215 52 M 205 55 Q 185 45 165 65 Q 185 72 200 72 M 190 75 Q 170 65 150 90 Q 170 98 185 95" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  </g>

  <!-- Ornate Royal Gold Bridle & Harness Details -->
  <path d="M 235 38 L 260 70 M 245 45 L 268 60" fill="none" stroke="url(#horseGold)" stroke-width="2"/>
  <circle cx="245" cy="45" r="3" fill="url(#horseGold)"/>
  <path d="M 140 170 Q 155 190 175 168" fill="none" stroke="url(#horseGold)" stroke-width="2.5"/>

  <!-- Sparkle Accents Around Horse -->
  <use href="#horseSparkle" x="270" y="20" transform="scale(1.4)"/>
  <use href="#horseSparkle" x="290" y="85" transform="scale(1.2)"/>
  <use href="#horseSparkle" x="220" y="130"/>
  <use href="#horseSparkle" x="120" y="160"/>
  <use href="#horseSparkle" x="40" y="210" transform="scale(1.3)"/>
  <use href="#horseSparkle" x="100" y="310"/>
</svg>
