<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false">
  <!-- Abstract Architectural Crystal Cluster Emblem -->
  <defs>
    <linearGradient id="crystalGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(200, 216, 245, 0.25)"/>
      <stop offset="50%" stop-color="rgba(212, 184, 150, 0.15)"/>
      <stop offset="100%" stop-color="rgba(200, 216, 245, 0.05)"/>
    </linearGradient>
    <linearGradient id="crystalGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(212, 184, 150, 0.3)"/>
      <stop offset="100%" stop-color="rgba(200, 216, 245, 0.08)"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer constellation ring -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="rgba(200, 216, 245, 0.1)" stroke-width="0.75" stroke-dasharray="2 4"/>
  <circle cx="100" cy="100" r="78" fill="none" stroke="rgba(212, 184, 150, 0.15)" stroke-width="0.5"/>

  <!-- Satellite stars at 12, 3, 6, 9 o'clock -->
  <polygon points="100,6 102,8 100,10 98,8" fill="rgba(212, 184, 150, 0.8)"/>
  <polygon points="194,100 192,102 190,100 192,98" fill="rgba(200, 216, 245, 0.6)"/>
  <polygon points="100,194 98,192 100,190 102,192" fill="rgba(212, 184, 150, 0.8)"/>
  <polygon points="6,100 8,98 10,100 8,102" fill="rgba(200, 216, 245, 0.6)"/>

  <!-- Main Crystal Facets (Geometric Lines & Translucent Polygons) -->
  <!-- Central Spindle -->
  <polygon points="100,24 135,100 100,176 65,100" fill="url(#crystalGrad1)" stroke="rgba(200, 216, 245, 0.35)" stroke-width="0.75"/>
  
  <!-- Facet Overlay Lines -->
  <line x1="100" y1="24" x2="100" y2="176" stroke="rgba(212, 184, 150, 0.4)" stroke-width="0.75"/>
  <line x1="65" y1="100" x2="135" y2="100" stroke="rgba(200, 216, 245, 0.25)" stroke-width="0.5"/>

  <!-- Inner Diamond Facets -->
  <polygon points="100,45 120,100 100,155 80,100" fill="url(#crystalGrad2)" stroke="rgba(212, 184, 150, 0.5)" stroke-width="0.75"/>
  
  <!-- Side Shards -->
  <polygon points="65,100 35,80 50,120" fill="rgba(200, 216, 245, 0.04)" stroke="rgba(200, 216, 245, 0.2)" stroke-width="0.5"/>
  <polygon points="135,100 165,80 150,120" fill="rgba(200, 216, 245, 0.04)" stroke="rgba(200, 216, 245, 0.2)" stroke-width="0.5"/>

  <!-- Top & Bottom Sparkles -->
  <circle cx="100" cy="100" r="2.5" fill="rgba(212, 184, 150, 0.9)" filter="url(#subtleGlow)"/>
  <circle cx="100" cy="45" r="1.5" fill="rgba(200, 216, 245, 0.8)"/>
  <circle cx="100" cy="155" r="1.5" fill="rgba(200, 216, 245, 0.8)"/>
</svg>
