<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
  <defs>
    <!-- Bright Light-Blue Radial Glow -->
    <radialGradient id="clockBlueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8F6FF" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#A9D8F5" stop-opacity="0.5"/>
      <stop offset="80%" stop-color="#4DA8E8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Clock Ring Gradient -->
    <linearGradient id="clockRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#A9D8F5"/>
      <stop offset="100%" stop-color="#4DA8E8"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6"/>
      <stop offset="100%" stop-color="#D9B86C"/>
    </linearGradient>

    <!-- Sparkle Cross -->
    <g id="clockSparkle">
      <path d="M 0,-10 Q 0,0 10,0 Q 0,0 0,10 Q 0,0 -10,0 Q 0,0 0,-10 Z" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="2.5" fill="#E8F6FF"/>
    </g>
  </defs>

  <!-- Aura Glow -->
  <circle cx="100" cy="100" r="95" fill="url(#clockBlueGlow)"/>

  <!-- Outer Decorative Rings -->
  <circle cx="100" cy="100" r="86" fill="none" stroke="url(#clockRingGrad)" stroke-width="2.5" opacity="0.9"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="#D6F0FF" stroke-width="1" stroke-dasharray="2 4" opacity="0.8"/>
  <circle cx="100" cy="100" r="72" fill="none" stroke="#4DA8E8" stroke-width="1.5" opacity="0.7"/>

  <!-- Inner Glass Dial Face -->
  <circle cx="100" cy="100" r="70" fill="rgba(17, 26, 58, 0.45)" stroke="url(#clockRingGrad)" stroke-width="1"/>

  <!-- 12 Roman Numerals / Star Markers -->
  <!-- 12 o'clock Midnight Star -->
  <polygon points="100,34 103,42 111,42 105,47 107,55 100,50 93,55 95,47 89,42 97,42" fill="url(#goldGrad)"/>

  <!-- Roman Numerals III, VI, IX in light blue -->
  <text x="160" y="106" font-family="'Cormorant Garamond', serif" font-size="16" font-weight="bold" fill="#E8F6FF" text-anchor="middle">III</text>
  <text x="100" y="165" font-family="'Cormorant Garamond', serif" font-size="16" font-weight="bold" fill="#E8F6FF" text-anchor="middle">VI</text>
  <text x="40" y="106" font-family="'Cormorant Garamond', serif" font-size="16" font-weight="bold" fill="#E8F6FF" text-anchor="middle">IX</text>

  <!-- Hour Tick Dots -->
  <circle cx="130" cy="48" r="2.5" fill="#A9D8F5"/>
  <circle cx="152" cy="70" r="2.5" fill="#A9D8F5"/>
  <circle cx="152" cy="130" r="2.5" fill="#A9D8F5"/>
  <circle cx="130" cy="152" r="2.5" fill="#A9D8F5"/>
  <circle cx="70" cy="152" r="2.5" fill="#A9D8F5"/>
  <circle cx="48" cy="130" r="2.5" fill="#A9D8F5"/>
  <circle cx="48" cy="70" r="2.5" fill="#A9D8F5"/>
  <circle cx="70" cy="48" r="2.5" fill="#A9D8F5"/>

  <!-- Midnight Clock Hands (11:58) -->
  <!-- Hour Hand pointing towards 12 -->
  <line x1="100" y1="100" x2="98" y2="58" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
  <!-- Minute Hand pointing right before 12 -->
  <line x1="100" y1="100" x2="94" y2="44" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Center Jewel Pivot -->
  <circle cx="100" cy="100" r="6" fill="#FFFFFF"/>
  <circle cx="100" cy="100" r="3" fill="#4DA8E8"/>

  <!-- Sparkling Accents -->
  <use href="#clockSparkle" x="100" y="22" transform="scale(1.2)"/>
  <use href="#clockSparkle" x="175" y="100"/>
  <use href="#clockSparkle" x="25" y="100"/>
  <use href="#clockSparkle" x="155" y="45"/>
  <use href="#clockSparkle" x="45" y="155"/>
</svg>
