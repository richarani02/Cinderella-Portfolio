<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" aria-hidden="true" focusable="false">
  <defs>
    <!-- Luminous Light Blue Glass Gradient for Crown Peaks -->
    <linearGradient id="crownGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#D6F0FF" stop-opacity="0.90"/>
      <stop offset="70%" stop-color="#A9D8F5" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#4DA8E8" stop-opacity="0.65"/>
    </linearGradient>

    <!-- Champagne Gold Crown Base Gradient -->
    <linearGradient id="crownGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6"/>
      <stop offset="50%" stop-color="#E5C778"/>
      <stop offset="100%" stop-color="#B8943D"/>
    </linearGradient>

    <!-- Cyan-Blue Radial Glow -->
    <radialGradient id="crownGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8F6FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#A9D8F5" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Sparkle Cross Symbol -->
    <g id="crownSparkle">
      <path d="M 0,-10 Q 0,0 10,0 Q 0,0 0,10 Q 0,0 -10,0 Q 0,0 0,-10 Z" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="2.5" fill="#E8F6FF"/>
    </g>
  </defs>

  <!-- Aura Glow -->
  <circle cx="150" cy="110" r="95" fill="url(#crownGlow)"/>

  <!-- Ornate Crown Base Arch & Band -->
  <path d="M 30 160 Q 150 180 270 160 Q 150 170 30 160 Z" fill="url(#crownGold)" stroke="#FFFFFF" stroke-width="1"/>
  <rect x="40" y="152" width="220" height="8" rx="4" fill="url(#crownGlass)" stroke="url(#crownGold)" stroke-width="1.5"/>

  <!-- Crown Spire 1 (Far Left) -->
  <path d="M 45 152 Q 40 100 65 75 Q 80 110 90 152 Z" fill="url(#crownGlass)" stroke="#FFFFFF" stroke-width="1.2"/>
  <circle cx="65" cy="72" r="6" fill="#FFFFFF"/>

  <!-- Crown Spire 2 (Mid Left) -->
  <path d="M 85 152 Q 95 70 115 45 Q 130 90 140 152 Z" fill="url(#crownGlass)" stroke="#FFFFFF" stroke-width="1.2"/>
  <circle cx="115" cy="42" r="8" fill="#FFFFFF"/>
  <circle cx="115" cy="42" r="4" fill="#A9D8F5"/>

  <!-- Center Main Tallest Royal Peak -->
  <path d="M 130 152 Q 140 40 150 15 Q 160 40 170 152 Z" fill="url(#crownGlass)" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="150" cy="12" r="10" fill="#FFFFFF"/>
  <polygon points="150,2 153,10 160,10 155,14 157,22 150,17 143,22 145,14 140,10 147,10" fill="url(#crownGold)"/>

  <!-- Crown Spire 4 (Mid Right) -->
  <path d="M 160 152 Q 170 90 185 45 Q 205 70 215 152 Z" fill="url(#crownGlass)" stroke="#FFFFFF" stroke-width="1.2"/>
  <circle cx="185" cy="42" r="8" fill="#FFFFFF"/>
  <circle cx="185" cy="42" r="4" fill="#A9D8F5"/>

  <!-- Crown Spire 5 (Far Right) -->
  <path d="M 210 152 Q 220 110 235 75 Q 260 100 255 152 Z" fill="url(#crownGlass)" stroke="#FFFFFF" stroke-width="1.2"/>
  <circle cx="235" cy="72" r="6" fill="#FFFFFF"/>

  <!-- Inner Delicate Filigree Arches -->
  <path d="M 65 140 Q 115 100 150 120 Q 185 100 235 140" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2 3"/>

  <!-- Large Center Teardrop Crystal Gem -->
  <path d="M 150 75 Q 162 95 150 115 Q 138 95 150 75 Z" fill="#FFFFFF" opacity="0.95" stroke="url(#crownGold)" stroke-width="1.5"/>
  <path d="M 150 82 Q 157 95 150 108 Q 143 95 150 82 Z" fill="#A9D8F5"/>

  <!-- Side Gem Accents -->
  <circle cx="115" cy="100" r="5" fill="#FFFFFF"/>
  <circle cx="185" cy="100" r="5" fill="#FFFFFF"/>

  <!-- Sparkle Cross Accents -->
  <use href="#crownSparkle" x="150" y="2" transform="scale(1.4)"/>
  <use href="#crownSparkle" x="115" y="42"/>
  <use href="#crownSparkle" x="185" y="42"/>
  <use href="#crownSparkle" x="65" y="72"/>
  <use href="#crownSparkle" x="235" y="72"/>
  <use href="#crownSparkle" x="150" y="115" transform="scale(1.2)"/>
</svg>
