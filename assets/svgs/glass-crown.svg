<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" aria-hidden="true" focusable="false">
  <defs>
    <!-- Bright Light-Blue Glass Crown Gradient -->
    <linearGradient id="crownGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#D6F0FF" stop-opacity="0.90"/>
      <stop offset="70%" stop-color="#A9D8F5" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#4DA8E8" stop-opacity="0.65"/>
    </linearGradient>

    <!-- Champagne Gold Accent Gradient -->
    <linearGradient id="crownGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6"/>
      <stop offset="50%" stop-color="#E5C778"/>
      <stop offset="100%" stop-color="#B8943D"/>
    </linearGradient>

    <!-- Radial Light-Blue Aura Glow -->
    <radialGradient id="crownGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8F6FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#A9D8F5" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Sparkle Cross Symbol -->
    <g id="crownSparkle">
      <path d="M 0,-10 Q 0,0 10,0 Q 0,0 0,10 Q 0,0 -10,0 Q 0,0 0,-10 Z" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="2.5" fill="#E8F6FF"/>
    </g>
  </defs>

  <!-- Aura Glow Backdrop -->
  <ellipse cx="160" cy="130" rx="140" ry="90" fill="url(#crownGlow)"/>

  <!-- Main Ornate Crown Base Rim -->
  <path d="M 40 180 Q 160 210 280 180 L 270 160 Q 160 190 50 160 Z" fill="url(#crownGold)" stroke="#FFFFFF" stroke-width="1.5"/>
  <path d="M 55 175 Q 160 200 265 175" fill="none" stroke="#D6F0FF" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- Ornate Tiara Spires (5 Royal Peaks) -->
  <!-- Center Main Peak -->
  <path d="M 130 165 L 160 50 L 190 165 Q 160 185 130 165 Z" fill="url(#crownGlass)" stroke="#FFFFFF" stroke-width="1.5"/>
  
  <!-- Inner Left Peak -->
  <path d="M 90 168 L 110 80 L 140 165 Q 115 180 90 168 Z" fill="url(#crownGlass)" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- Inner Right Peak -->
  <path d="M 180 165 L 210 80 L 230 168 Q 205 180 180 165 Z" fill="url(#crownGlass)" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- Outer Left Peak -->
  <path d="M 50 160 L 65 110 L 95 168 Q 72 175 50 160 Z" fill="url(#crownGlass)" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- Outer Right Peak -->
  <path d="M 225 168 L 255 110 L 270 160 Q 248 175 225 168 Z" fill="url(#crownGlass)" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- Scrollwork Arches & Fleur-de-lis Details -->
  <path d="M 65 110 Q 87 135 110 80 Q 135 125 160 50 Q 185 125 210 80 Q 233 135 255 110" fill="none" stroke="url(#crownGold)" stroke-width="2.5"/>

  <!-- Diamond & Star Jewels atop Spire Peaks -->
  <!-- Center Peak Star Jewel -->
  <circle cx="160" cy="50" r="9" fill="#FFFFFF"/>
  <polygon points="160,35 163,45 173,45 165,51 168,61 160,55 152,61 155,51 147,45 157,45" fill="url(#crownGold)"/>

  <!-- Inner Left Jewel -->
  <circle cx="110" cy="80" r="6.5" fill="#FFFFFF"/>
  <circle cx="110" cy="80" r="3.5" fill="#4DA8E8"/>

  <!-- Inner Right Jewel -->
  <circle cx="210" cy="80" r="6.5" fill="#FFFFFF"/>
  <circle cx="210" cy="80" r="3.5" fill="#4DA8E8"/>

  <!-- Outer Left Jewel -->
  <circle cx="65" cy="110" r="5" fill="#FFFFFF"/>

  <!-- Outer Right Jewel -->
  <circle cx="255" cy="110" r="5" fill="#FFFFFF"/>

  <!-- Base Rim Embedded Gems -->
  <circle cx="85" cy="172" r="3.5" fill="#FFFFFF"/>
  <circle cx="120" cy="178" r="4.5" fill="url(#crownGold)"/>
  <circle cx="160" cy="182" r="5.5" fill="#FFFFFF"/>
  <circle cx="200" cy="178" r="4.5" fill="url(#crownGold)"/>
  <circle cx="235" cy="172" r="3.5" fill="#FFFFFF"/>

  <!-- Sparkle Accents -->
  <use href="#crownSparkle" x="160" y="32" transform="scale(1.4)"/>
  <use href="#crownSparkle" x="110" y="70" transform="scale(1.1)"/>
  <use href="#crownSparkle" x="210" y="70" transform="scale(1.1)"/>
  <use href="#crownSparkle" x="65" y="100"/>
  <use href="#crownSparkle" x="255" y="100"/>
  <use href="#crownSparkle" x="160" y="182" transform="scale(1.2)"/>
</svg>
