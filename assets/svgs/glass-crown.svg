<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" aria-hidden="true" focusable="false">
  <defs>
    <!-- Bright Shining Light Blue Glass Crown Gradient -->
    <linearGradient id="crownGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#D6F0FF" stop-opacity="0.90"/>
      <stop offset="70%" stop-color="#A9D8F5" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#4DA8E8" stop-opacity="0.65"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="crownGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6"/>
      <stop offset="50%" stop-color="#E5C778"/>
      <stop offset="100%" stop-color="#B8943D"/>
    </linearGradient>

    <!-- Radial Glow Backdrop -->
    <radialGradient id="crownGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8F6FF" stop-opacity="0.80"/>
      <stop offset="50%" stop-color="#A9D8F5" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Sparkle Cross -->
    <g id="crownSparkle">
      <path d="M 0,-10 Q 0,0 10,0 Q 0,0 0,10 Q 0,0 -10,0 Q 0,0 0,-10 Z" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="2.5" fill="#E8F6FF"/>
    </g>
  </defs>

  <!-- Luminous Background Aura -->
  <circle cx="150" cy="100" r="95" fill="url(#crownGlow)"/>

  <!-- Ornate Tiara / Crown Arch Base -->
  <path d="M 30 160 Q 150 190 270 160 Q 150 175 30 160 Z" fill="url(#crownGold)"/>
  <path d="M 40 155 Q 150 180 260 155" fill="none" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Crown Base Gem Band -->
  <rect x="45" y="152" width="210" height="10" rx="5" fill="url(#crownGlass)" stroke="#FFFFFF" stroke-width="1"/>
  <circle cx="70" cy="157" r="3" fill="url(#crownGold)"/>
  <circle cx="110" cy="157" r="3" fill="#FFFFFF"/>
  <circle cx="150" cy="157" r="4" fill="url(#crownGold)"/>
  <circle cx="190" cy="157" r="3" fill="#FFFFFF"/>
  <circle cx="230" cy="157" r="3" fill="url(#crownGold)"/>

  <!-- 5 Royal Glass Spires & Peaks -->
  <!-- Outer Left Peak -->
  <path d="M 50 150 L 35 100 L 70 125 L 90 150 Z" fill="url(#crownGlass)" stroke="#FFFFFF" stroke-width="1.2"/>
  <circle cx="35" cy="98" r="5" fill="#FFFFFF"/>

  <!-- Inner Left Peak -->
  <path d="M 85 150 L 95 65 L 125 115 L 140 150 Z" fill="url(#crownGlass)" stroke="#FFFFFF" stroke-width="1.2"/>
  <circle cx="95" cy="63" r="6" fill="url(#crownGold)"/>

  <!-- Center Grand Peak -->
  <path d="M 130 150 L 150 30 L 170 150 Z" fill="url(#crownGlass)" stroke="#FFFFFF" stroke-width="1.5"/>
  <!-- Central Star Diamond in Center Peak -->
  <polygon points="150,30 156,48 174,48 160,60 165,78 150,67 135,78 140,60 126,48 144,48" fill="#FFFFFF"/>
  <circle cx="150" cy="28" r="8" fill="#FFFFFF"/>
  <circle cx="150" cy="28" r="4" fill="#4DA8E8"/>

  <!-- Inner Right Peak -->
  <path d="M 160 150 L 175 115 L 205 65 L 215 150 Z" fill="url(#crownGlass)" stroke="#FFFFFF" stroke-width="1.2"/>
  <circle cx="205" cy="63" r="6" fill="url(#crownGold)"/>

  <!-- Outer Right Peak -->
  <path d="M 210 150 L 230 125 L 265 100 L 250 150 Z" fill="url(#crownGlass)" stroke="#FFFFFF" stroke-width="1.2"/>
  <circle cx="265" cy="98" r="5" fill="#FFFFFF"/>

  <!-- Intricate Inner Filigree Scrollwork -->
  <path d="M 70 145 Q 95 110 125 145 M 175 145 Q 205 110 230 145" fill="none" stroke="url(#crownGold)" stroke-width="2"/>
  <path d="M 110 145 Q 150 90 190 145" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- Sparkle Cross Accents -->
  <use href="#crownSparkle" x="150" y="28" transform="scale(1.5)"/>
  <use href="#crownSparkle" x="95" y="63" transform="scale(1.2)"/>
  <use href="#crownSparkle" x="205" y="63" transform="scale(1.2)"/>
  <use href="#crownSparkle" x="35" y="98"/>
  <use href="#crownSparkle" x="265" y="98"/>
  <use href="#crownSparkle" x="150" y="110" transform="scale(1.3)"/>
</svg>
