<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background: Midnight Navy -->
  <rect width="32" height="32" fill="#111A3A" rx="6"/>

  <!-- Outer soft glow ring — Cinderella Blue -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="rgba(169,216,245,0.15)" stroke-width="1"/>

  <!-- 4-point star — Champagne Gold -->
  <!-- Vertical arm -->
  <polygon
    points="16,4 17.2,13.8 16,15 14.8,13.8"
    fill="#D9B86C" opacity="0.95"/>
  <polygon
    points="16,28 17.2,18.2 16,17 14.8,18.2"
    fill="#D9B86C" opacity="0.95"/>
  <!-- Horizontal arm -->
  <polygon
    points="4,16 13.8,14.8 15,16 13.8,17.2"
    fill="#D9B86C" opacity="0.95"/>
  <polygon
    points="28,16 18.2,14.8 17,16 18.2,17.2"
    fill="#D9B86C" opacity="0.95"/>

  <!-- Center diamond -->
  <polygon
    points="16,12 19,16 16,20 13,16"
    fill="#FFF9F0" opacity="0.95"/>

  <!-- Tiny corner sparkle dots — Cinderella Blue -->
  <circle cx="6"  cy="6"  r="1"   fill="#A9D8F5" opacity="0.7"/>
  <circle cx="26" cy="6"  r="0.8" fill="#A9D8F5" opacity="0.5"/>
  <circle cx="6"  cy="26" r="0.8" fill="#A9D8F5" opacity="0.5"/>
  <circle cx="26" cy="26" r="1"   fill="#D9B86C" opacity="0.6"/>
</svg>
